    - <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont/style.css" media="print" onload="this.media='all'"> #字体

logo:
  icon: https://dagongdeyatou-img-bed.oss-cn-hangzhou.aliyuncs.com/img/2026/01/shiba-20260117-095821.png
  title: 打工的丫头
  subtitle: "年少藏山河于心 以为过目即永 | 如今信寸墨留痕 方抵岁月无声"
menubar:
  items:
    - id: post
      theme: "#1BCDFC"
      icon: solar:documents-bold-duotone
      title: 博客
      url: /
    - id: news
      theme: "#3DC550"
      icon: solar:notebook-bookmark-bold-duotone
      title: 简报
      url: /news/
    - id: about
      theme: "#FA6400"
      icon: solar:planet-bold-duotone
      title: 关于
      url: /about/
    - id: friends
      theme: "#F44336"
      icon: solar:chat-square-like-bold-duotone
      title: 社交
      url: /friends/

site_tree:
  home:
    sidebar: starter, welcome, recent
    rightbar: timeline
  index_note:
    base_dir: note # 只影响自动生成的页面路径
    menu_id: note
    sidebar: starter, welcome, recent
    leftbar: ghissues, related, recent # for wiki
    rightbar: timeline
  index_about:
    base_dir: about # 只影响自动生成的页面路径
    menu_id: about
  index_friends:
    base_dir: friends # 只影响自动生成的页面路径
    menu_id: friends

article:
  auto_excerpt: 50 # 设置自动摘要长度
  license: "本文由[@打工的丫头](/)编写，采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处，带带单打独斗的弟弟。" # 许可协议
  related_posts: #开启可能感兴趣文章
    enable: true
    title: 您可能感兴趣的文章
  share: [wechat, weibo, email, link]

style:
  prefers_theme: light # light, dark, auto
  text-align: justify
  smooth_scroll: false
  codeblock:
    scrollbar: 0px
  font-size:
    body: 1rem
  font-family:
    logo: '"LXGW WenKai Screen", system-ui, "Microsoft Yahei", "Segoe UI", -apple-system, Roboto, Ubuntu, "Helvetica Neue", Arial, "WenQuanYi Micro Hei", sans-serif'
    # body: '"LXGW WenKai Screen", system-ui, "Microsoft Yahei", "Segoe UI", -apple-system, Roboto, Ubuntu, "Helvetica Neue", Arial, "WenQuanYi Micro Hei", sans-serif'
    body: '"LXGW WenKai Screen", sans-serif'
    code: '"LXGW WenKai Screen", Menlo, Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif'
    codeblock: 'Menlo, Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif'
  color:
    # 动态颜色（会根据明暗主题重设明度值，只用关心色相和饱和度即可）
    background: "hsl(212 16% 98%)" # 浅色背景颜色
    block: "hsl(212 8% 95%)" # 块背景颜色
    code: "hsl(220 20% 10%)" # 'hsl(14 100% 48%)' # 行内代码颜色
    text: "hsl(0 0% 20%)" # 文本颜色
    # 主题色配置（不会根据明暗动态调整，请设置为通用的颜色）
    # theme: 'hsl(192 98% 55%)' # 主题色
    theme: "hsl(88 76% 40%)" # 主题色
    accent: "hsl(14 100% 57%)" # 强调色
    link: "hsl(88 76% 40%)" # 超链接颜色
    hover: "hsl(14 100% 57%)" # 按钮高亮颜色

# 文章搜索
search:
  service: local_search # local_search, todo...
  local_search:
    field: all # post, page, all
    path: /search.json # 搜索文件存放位置
    content: true # 是否搜索内容
    skip_search: [] # 指定 path 中的内容不被搜索。
    codeblock: true # 是否搜索代码块（需要content: true)

